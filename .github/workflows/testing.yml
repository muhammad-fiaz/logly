name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-tests
      - name: Run cargo test
        run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  python-linting:
    name: Python Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: lint
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Install Dependencies
        run: |
          uv sync --group dev
          uv run --group dev maturin develop --release
      - name: Ruff format check
        run: uv run --group dev ruff format logly tests --check
      - name: Lint with ruff
        run: uv run --group dev ruff check .
      - name: mypy check
        run: uv run --group dev mypy logly tests

  testing:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: test-${{ matrix.os }}-${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync --group dev
          uv run --group dev maturin develop --release
      - name: Test with pytest
        run: uv run --group dev pytest
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  testing-windows-x86:
    name: Tests (Python ${{ matrix.python-version }}, windows-latest x86)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.4"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: test-windows-x86-${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x86
      - name: Install Rust x86 target
        run: rustup target add i686-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-windows-x86-${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync
          uv run maturin develop --release --target i686-pc-windows-msvc
          uv pip install pytest pytest-cov
      - name: Test with pytest
        run: uv run pytest

  testing-windows-arm64:
    name: Tests (Python ${{ matrix.python-version }}, windows-11-arm)
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.11", "3.12", "3.13", "3.14", "3.15.0-beta.4"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: test-windows-arm64-${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Install Rust aarch64 target
        run: rustup target add aarch64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-windows-arm64-${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync
          uv run maturin develop --release --target aarch64-pc-windows-msvc
          uv pip install pytest pytest-cov
      - name: Test with pytest
        run: uv run pytest

  testing-linux-x86:
    name: Tests (Python ${{ matrix.python-version }}, ubuntu-latest x86)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.4"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
          manylinux: auto
      - name: Verify wheel exists
        run: ls -la dist/

  testing-linux-aarch64:
    name: Tests (Python ${{ matrix.python-version }}, ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.4"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: test-linux-aarch64-${{ matrix.python-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-linux-aarch64-${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          uv sync --group dev
          uv run --group dev maturin develop --release
      - name: Test with pytest
        run: uv run --group dev pytest
