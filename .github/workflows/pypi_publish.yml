name: PyPI Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  # Required for PyPI Trusted Publishing.
  id-token: write

jobs:
  linux-x86_64:
    name: Linux (x86_64, Python ${{ matrix.python.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python:
          - version: "3.10"
            flat: "cp310-cp310"
          - version: "3.11"
            flat: "cp311-cp311"
          - version: "3.12"
            flat: "cp312-cp312"
          - version: "3.13"
            flat: "cp313-cp313"
          - version: "3.14"
            flat: "cp314-cp314"
          - version: "3.15.0-rc.2"
            flat: "cp315-cp315"
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i /opt/python/${{ matrix.python.flat }}/bin/python
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64-py${{ matrix.python.version }}
          path: dist

  linux-x86:
    name: Linux (x86, Python ${{ matrix.python.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python:
          - version: "3.10"
            flat: "cp310-cp310"
          - version: "3.11"
            flat: "cp311-cp311"
          - version: "3.12"
            flat: "cp312-cp312"
          - version: "3.13"
            flat: "cp313-cp313"
          - version: "3.14"
            flat: "cp314-cp314"
          - version: "3.15.0-rc.2"
            flat: "cp315-cp315"
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86
          args: --release --out dist -i /opt/python/${{ matrix.python.flat }}/bin/python
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86-py${{ matrix.python.version }}
          path: dist

  linux-aarch64:
    name: Linux (aarch64, Python ${{ matrix.python.version }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        python:
          - version: "3.10"
            flat: "cp310-cp310"
          - version: "3.11"
            flat: "cp311-cp311"
          - version: "3.12"
            flat: "cp312-cp312"
          - version: "3.13"
            flat: "cp313-cp313"
          - version: "3.14"
            flat: "cp314-cp314"
          - version: "3.15.0-rc.2"
            flat: "cp315-cp315"
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i /opt/python/${{ matrix.python.flat }}/bin/python
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64-py${{ matrix.python.version }}
          path: dist

  windows:
    name: Windows (${{ matrix.target }}, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [x64, x86]
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-rc.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target }}
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  windows-arm64:
    name: Windows (arm64, Python ${{ matrix.python-version }})
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
          ["3.11", "3.12", "3.13", "3.14", "3.15.0-rc.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist -i python
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-arm64-py${{ matrix.python-version }}
          path: dist

  macos:
    name: macOS (${{ matrix.python-version }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-rc.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-py${{ matrix.python-version }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [linux-x86_64, linux-x86, linux-aarch64, windows, windows-arm64, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/logly/
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List artifacts
        run: ls -la dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  upload-github-release:
    name: Upload wheels to GitHub Release
    needs: [linux-x86_64, linux-x86, linux-aarch64, windows, windows-arm64, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
