name: PyPI Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  # Required for PyPI Trusted Publishing.
  id-token: write

jobs:
  linux-x86_64:
    name: Linux (x86_64, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64-py${{ matrix.python-version }}
          path: dist

  linux-x86:
    name: Linux (x86, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86-py${{ matrix.python-version }}
          path: dist

  linux-aarch64:
    name: Linux (aarch64, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64-py${{ matrix.python-version }}
          path: dist

  windows:
    name: Windows (${{ matrix.target }}, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      matrix:
        target: [x64, x86]
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target }}
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  windows-arm64:
    name: Windows (arm64, Python ${{ matrix.python-version }})
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      matrix:
        python-version:
          ["3.11", "3.12", "3.13", "3.14", "3.15.0-beta.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-arm64-py${{ matrix.python-version }}
          path: dist

  macos:
    name: macOS (${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-beta.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter --compatibility off
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-py${{ matrix.python-version }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [linux-x86_64, linux-x86, linux-aarch64, windows, windows-arm64, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/logly/
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List artifacts
        run: ls -la dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  upload-github-release:
    name: Upload wheels to GitHub Release
    needs: [linux-x86_64, linux-x86, linux-aarch64, windows, windows-arm64, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  update-release-notes:
    name: Update Release Notes
    needs: [publish-pypi, upload-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Generate artifact table
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"

          TABLE="## Wheel Downloads\n\n"
          TABLE+="| Platform | Architecture | Python | Download |\n"
          TABLE+="|----------|-------------|--------|----------|\n"

          for f in $(ls dist/ | sort); do
            # Skip sdist
            if [[ "$f" == *.tar.gz ]]; then
              TABLE+="| Source | All | 3.10+ | [${f}](${DOWNLOAD_BASE}/${f}) |\n"
              continue
            fi

            # Parse wheel filename: logly-VERSION-cpXY-cpXY-PLATFORM.whl
            BASENAME="${f%.whl}"
            PLATFORM="${BASENAME##*-}"

            # Determine OS and architecture from platform tag
            case "$PLATFORM" in
              *linux*x86_64*|*manylinux*x86_64*)
                OS="Linux"; ARCH="x86_64" ;;
              *linux*aarch64*|*manylinux*aarch64*)
                OS="Linux"; ARCH="aarch64" ;;
              *win_amd64*)
                OS="Windows"; ARCH="x64" ;;
              *win32*)
                OS="Windows"; ARCH="x86" ;;
              *win_arm64*)
                OS="Windows"; ARCH="arm64" ;;
              *macosx*arm64*)
                OS="macOS"; ARCH="aarch64 (Apple Silicon)" ;;
              *macosx*x86_64*)
                OS="macOS"; ARCH="x86_64 (Intel)" ;;
              *)
                OS="Unknown"; ARCH="$PLATFORM" ;;
            esac

            # Extract Python version from filename
            PYVER=$(echo "$BASENAME" | grep -oP 'cp\K[0-9]+' | head -1)
            if [ -n "$PYVER" ]; then
              PYVER="${PYVER:0:1}.${PYVER:1}"
            else
              PYVER="?"
            fi

            TABLE+="| ${OS} | ${ARCH} | ${PYVER} | [${f}](${DOWNLOAD_BASE}/${f}) |\n"
          done

          # Write multiline output
          {
            echo "table<<TABLEEOF"
            echo -e "$TABLE"
            echo "TABLEEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update Release Body
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ github.event.release.body }}

            ${{ steps.artifacts.outputs.table }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
