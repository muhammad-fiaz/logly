name-template: "v$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
categories:
  - title: "Breaking Changes"
    labels:
      - "breaking-change"
      - "breaking"
  - title: "Features"
    labels:
      - "enhancement"
      - "feature"
      - "new-feature"
  - title: "Bug Fixes"
    labels:
      - "bug"
      - "fix"
      - "bugfix"
  - title: "Improvements"
    labels:
      - "improvement"
      - "refactor"
      - "performance"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
      - "doc"
  - title: "Dependencies"
    labels:
      - "dependencies"
      - "deps"
  - title: "CI/CD & Maintenance"
    labels:
      - "ci"
      - "chore"
      - "maintenance"
exclude-labels:
  - "skip-changelog"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "enhancement"
      - "feature"
      - "new-feature"
  patch:
    labels:
      - "patch"
      - "bug"
      - "fix"
      - "bugfix"
      - "dependencies"
  default: patch
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
no-changes-template: "No changes since last release."
template: |-

  ## Installation

  ### pip

  ```bash
  pip install logly==$RESOLVED_VERSION
  ```

  ### uv

  ```bash
  uv add logly==$RESOLVED_VERSION
  ```

  ### From Source

  ```bash
  git clone https://github.com/muhammad-fiaz/logly.git
  cd logly
  git checkout $RESOLVED_VERSION
  uv sync
  uv run maturin develop
  ```

  ## What's Changed

  $CHANGES

  ## Quick Start

  ```python
  from logly import logger

  logger.info("Hello from Logly!")
  logger.add("app.log", rotation="daily", retention="30 days", compression="gzip")
  logger.bind(user_id="12345").info("User logged in")

  with logger.catch():
      risky_operation()

  logger.complete()
  ```

  ## Links

  - [PyPI](https://pypi.org/project/logly/$RESOLVED_VERSION/)
  - [Documentation](https://muhammad-fiaz.github.io/logly/)
  - [GitHub](https://github.com/muhammad-fiaz/logly)
  - [Changelog](https://github.com/muhammad-fiaz/logly/releases)
  - [Issue Tracker](https://github.com/muhammad-fiaz/logly/issues)

  ## Contributors

  $CONTRIBUTORS

  ---

  **Full Changelog**: https://github.com/muhammad-fiaz/logly/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
