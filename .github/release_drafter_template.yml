name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Breaking Changes"
    labels:
      - "breaking-change"
      - "breaking"
  - title: "Features"
    labels:
      - "enhancement"
      - "feature"
      - "new-feature"
  - title: "Bug Fixes"
    labels:
      - "bug"
      - "fix"
      - "bugfix"
  - title: "Improvements"
    labels:
      - "improvement"
      - "refactor"
      - "performance"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
      - "doc"
  - title: "Dependencies"
    labels:
      - "dependencies"
      - "deps"
  - title: "CI/CD & Maintenance"
    labels:
      - "ci"
      - "chore"
      - "maintenance"
exclude-labels:
  - "skip-changelog"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "enhancement"
      - "feature"
      - "new-feature"
  patch:
    labels:
      - "patch"
      - "bug"
      - "fix"
      - "bugfix"
      - "dependencies"
  default: patch
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
no-changes-template: "No changes since last release."
template: |
  ## Installation

  ### pip

  ```bash
  pip install logly==$RESOLVED_VERSION
  ```

  ### uv

  ```bash
  uv add logly==$RESOLVED_VERSION
  ```

  ### From Source

  ```bash
  git clone https://github.com/muhammad-fiaz/logly.git
  cd logly
  git checkout v$RESOLVED_VERSION
  uv sync
  uv run maturin develop
  ```

